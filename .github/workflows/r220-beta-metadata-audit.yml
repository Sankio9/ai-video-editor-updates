name: R2.2 Beta metadata console encoding reproducibility
on:
  push:
    branches: [feature/r20-independent-graphics-gate]
    paths: ['.github/workflows/r220-beta-metadata-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce windows cp1252 output from current releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api repos/$GH_REPO/releases?per_page=40 > /tmp/releases.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/releases.json'))
          for r in rows:
            if not r['prerelease']: continue
            name=r['name'];body=r['body'] or ''
            for field,text in [('name',name),('body',body)]:
              try:text.encode('cp1252')
              except UnicodeEncodeError as e:
                print('ENCODING_PROBLEM',r['tag_name'],field,
                      'at',e.start,'codepoint',hex(ord(text[e.start])),
                      'context',repr(text[max(0,e.start-30):e.start+30]))
            if r['tag_name']=='v2.2.0':
              print('LATEST_BETA_TAG',r['tag_name'],'ASSETS',[(a['name'],a.get('digest')) for a in r['assets']])
          PY
