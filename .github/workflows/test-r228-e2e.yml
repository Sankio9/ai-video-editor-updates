name: R2.2.8 deterministic CEP boot race + full R220 subtitle flow (NO RELEASE)
on:
  push:
    branches: [feature/r20-independent-graphics-gate]
    paths: ['.github/workflows/test-r228-e2e.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce asynchronous CEP UI timing and full readback->Python->V3 path
        run: |
          set -eu
          node --check experimental/r20/r228/cep/r228_subtitles_panel.js
          node experimental/r20/r228/tests/test_r228_bootstrap_e2e.js
          echo 'CEP global require / asynchronous DOM / captured click tested'
          node experimental/r20/r227/tests/test_r227_recovery.js
          node experimental/r20/r227/tests/test_r227_panel.js
          node experimental/r20/r226/tests/test_r226_jsx.js
          python -m unittest discover -s experimental/r20/r226/tests -p test_*.py -v
          python -m unittest discover -s experimental/r20/r220/tests -p test_*.py -v
          node experimental/r20/r220/tests/test_r220_writer.js
      - name: Validate pinned v2.2.7 panel and produce verified R2.2.8 one-file preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p /tmp/aive dist
          gh release download v2.2.7 -p AIVE_UPDATE.zip --dir /tmp/aive
          mv /tmp/aive/AIVE_UPDATE.zip /tmp/aive/v227.zip
          gh release download v2.1.1 -p AIVE_UPDATE.zip --dir /tmp/aive
          mv /tmp/aive/AIVE_UPDATE.zip /tmp/aive/v211.zip
          python experimental/r20/r228/build_r228.py --v227 /tmp/aive/v227.zip --v211 /tmp/aive/v211.zip --out dist/AIVE_UPDATE.zip
          python - <<'PY'
          import hashlib,zipfile,json,pathlib
          sha=lambda b:hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile("dist/AIVE_UPDATE.zip") as z:
            p=json.loads(z.read("manifest.json"))
            assert p["version"]=="2.2.8" and len(p["files"])==1
            row=p["files"][0]
            assert row["path"]=="cep/r20_panel.js"
            data=z.read("payload/cep/r20_panel.js")
            assert sha(data)==row["sha256"]
            assert b"onClickCapture" in data
            assert b"oldClick" not in data
            assert b"R2.2.8 BETA" in data
            assert b"r207OmitStruck" in data
            print("PASS R2.2.8 exact release baseline, single-file content, SHA and approved R2.1.1 prefix")
          PY
