name: Publish AI Video Editor update
on:
  push:
    branches: [main]
    paths: ['release/next.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aive-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and validate
        run: |
          python3 scripts/build_release.py --output dist/AIVE_UPDATE.zip
          python3 - <<'PY'
          import hashlib,json,zipfile
          with zipfile.ZipFile('dist/AIVE_UPDATE.zip') as z:
              m=json.loads(z.read('manifest.json'))
              for entry in m['files']:
                  assert hashlib.sha256(z.read('payload/'+entry['path'])).hexdigest()==entry['sha256']
          print('Verified')
          PY
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          VERSION="$(python3 -c "import json;print(json.load(open('release/next.json'))['version'])")"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" dist/AIVE_UPDATE.zip --title "AI Video Editor $TAG" --notes "Safe channel smoke test, no editorial module changes." --latest
