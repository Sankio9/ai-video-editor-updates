name: "R245 Word layouts: V3 no metadata and V4 explicit identities (NO RELEASE)"
on:
  push:
    branches: [feature/r20-independent-graphics-gate]
    paths: [.github/workflows/test-r245-word-regression.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Fetch exact current published Beta and strict before-SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          python -m pip -q install python-docx
          mkdir -p /tmp/current /tmp/r245_runtime/tools dist
          gh release download v2.3.6 -p AIVE_UPDATE.zip --dir /tmp/current
          python experimental/r20/r245/build_r245.py --base /tmp/current/AIVE_UPDATE.zip --out dist/AIVE_UPDATE.zip
          python - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('/tmp/current/AIVE_UPDATE.zip') as z:
            for p in ('tools/r20_graphics_plans.py','tools/r237_coverage.py'):
              (pathlib.Path('/tmp/r245_runtime/tools')/pathlib.Path(p).name).write_bytes(z.read('payload/'+p))
          with zipfile.ZipFile('dist/AIVE_UPDATE.zip') as z:
            for p in ('tools/r230_universal.py','tools/r236_name_guard.py'):
              (pathlib.Path('/tmp/r245_runtime/tools')/pathlib.Path(p).name).write_bytes(z.read('payload/'+p))
            pathlib.Path('dist/panel.js').write_bytes(z.read('payload/cep/r20_panel.js'))
          PY
      - name: Regression synthetic Angelus and Workers Word structure
        run: |
          python experimental/r20/r245/tests/test_r245_scripts.py
      - name: Independent parser backwards compatible with Balatina baseline
        run: |
          mkdir -p /tmp/r236_runtime/tools
          cp /tmp/r245_runtime/tools/*.py /tmp/r236_runtime/tools/
          python experimental/r20/r236/tests/test_r236_balatinaname.py
          python experimental/r20/r237/tests/test_r237_balatinashape.py
      - name: Strict package scope, JS syntax and unchanged approved tracks
        run: |
          set -eu
          node --check dist/panel.js
          python - <<'PY'
          import zipfile,json,hashlib
          h=lambda b:hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('dist/AIVE_UPDATE.zip') as z,zipfile.ZipFile('/tmp/current/AIVE_UPDATE.zip') as before:
            m=json.loads(z.read('manifest.json'))
            assert m['version']=='2.3.7'
            expected={'cep/r20_panel.js','tools/r230_universal.py','tools/r236_name_guard.py'}
            assert {x['path'] for x in m['files']}==expected
            for x in m['files']:
              p=x['path']
              assert h(z.read('payload/'+p))==x['sha256']
              src=before.read('payload/'+p)
              assert h(src)==x['before_sha256']
          print('PASS 3-file patch; Montage, VO writer, updater, Stable unchanged')
          PY
