name: R2.2 updater Unicode encoding audit
on:
  push:
    branches: [feature/r20-independent-graphics-gate]
    paths: ['.github/workflows/r220-updater-unicode-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original public updater and release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import zipfile,base64,io,json
          archive=base64.b64decode(open('release/assets/v1.9.3.zip.b64','rb').read())
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              manifest=json.loads(z.read('manifest.json'))
              for row in manifest['files']:
                  name=row['path']
                  if 'updat' not in name.lower(): continue
                  raw=z.read('payload/'+name)
                  print('UPDATER_FILE',name,'LENGTH',len(raw))
                  try:s=raw.decode('utf8')
                  except UnicodeDecodeError:continue
                  for i,line in enumerate(s.splitlines()):
                      print('UPDATER_LINE',i+1,line[:250])
          PY
          gh release view v2.2.0 --json tagName,name,body,isPrerelease > /tmp/release.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/release.json'))
          print('BETA_TITLE_ESCAPED',x.get('name','').encode('ascii','backslashreplace'))
          print('BETA_BODY_FIRST_200',x.get('body','')[:200].encode('ascii','backslashreplace'))
          PY
