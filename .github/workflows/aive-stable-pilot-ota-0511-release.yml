name: AIVE STABLE PILOT 0.5.11 — Adobe signing repair
on:
  push:
    branches: [main]
    paths:
      - 'release/stable-pilot/assets/AIVE_STABLE_PILOT_0.5.11_UPDATE.zip'
      - '.github/workflows/aive-stable-pilot-ota-0511-release.yml'
permissions:
  contents: write
concurrency:
  group: aive-stable-pilot-0511-publish
  cancel-in-progress: false
jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact ZIP SHA, archive inventory and original scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,zipfile,re,xml.etree.ElementTree as ET,pathlib
          p=pathlib.Path('release/stable-pilot/assets/AIVE_STABLE_PILOT_0.5.11_UPDATE.zip')
          H=lambda data:hashlib.sha256(data).hexdigest()
          expected='366ecee1cc177b6c5c34a95dded70be846b9135db7c049faf0f314570d1b1616'
          assert p.stat().st_size==113797 and H(p.read_bytes())==expected, 'ZIP SHA or size mismatch'
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None, 'ZIP CRC invalid'
            names=z.namelist()
            assert len(names)==14 and len(set(names))==14,'ZIP entry count invalid'
            assert set(names)=={
              'EXTENSION_SHA256SUMS.txt','INSTALL_PERSONAL.cmd','INSTALL_PERSONAL.ps1',
              'extension/CSXS/manifest.xml','extension/index.html',
              'extension/jsx/aive_graphics.jsx','extension/jsx/aive_stable.jsx',
              'extension/lib/editorial.js','extension/lib/interpreter.js',
              'extension/lib/panel.js','extension/lib/updater.js',
              'extension/lib/vendor/JSZIP_LICENSE.md',
              'extension/lib/vendor/jszip.min.js','extension/update/worker.ps1'},'ZIP contains unexpected files'
            assert all(not(n.startswith('/') or '..' in n or '\\' in n) for n in names),'Unsafe path'
            xml=ET.fromstring(z.read('extension/CSXS/manifest.xml'))
            assert xml.attrib['ExtensionBundleId']=='com.aive.stable.pilot'
            assert xml.attrib['ExtensionBundleVersion']=='0.5.11'
            registry={}
            for line in z.read('EXTENSION_SHA256SUMS.txt').decode('utf-8').splitlines():
              m=re.fullmatch(r'([a-f0-9]{64})  ([^\r\n]+)',line)
              assert m, 'Invalid SHA record'
              digest,rel=m.groups()
              assert rel not in registry,'Duplicate SHA path'
              assert 'extension/'+rel in names and H(z.read('extension/'+rel))==digest, 'SHA mismatch: '+rel
              registry[rel]=digest
            assert len(registry)==11 and set(registry)==set(n[10:] for n in names if n.startswith('extension/')),'Wrong file inventory'
            pinned={
              'lib/editorial.js':'0a59e86f135927c883daee2bf984729fec43f8519539a51493c711c0a76a940e',
              'lib/interpreter.js':'5d5a2e5c129b8beeda99acce76665bc2e5b1edf6b5d4ba16d7809283e1a998ea',
              'lib/panel.js':'3e64d0d92a6ddb0ee1b3348c8cd2eb487109e9c93b3ed6efec29e0454af1d855',
              'lib/updater.js':'5b390c5cc76443eeaba3ef0e62bd715fb09f6ceace831d6af7588fa41c7e36cc',
              'jsx/aive_graphics.jsx':'25e1e15cc6d0c3757b4c536ab892172dd0f1fcdca0ad05791932dc610a9a296b',
              'jsx/aive_stable.jsx':'36a2d38fba6beb65e34fc96ee3b3996bd92b03d2a4f2c55fc42dc1625567c367',
              'update/worker.ps1':'347670d0e8215339f9735f62e3387b20c91faed09e30e2e104466b8239a77cb0'}
            for rel,digest in pinned.items():assert registry[rel]==digest,'Unexpected script: '+rel
            assert b"ExtensionBundleVersion -ne '0.5.11'" in z.read('INSTALL_PERSONAL.ps1')
            assert b"var VERSION='0.5.11'" in z.read('extension/lib/updater.js')
            z.extractall('/tmp/aive0511')
          print('PASS: exact archive, version, 11 hashes, unchanged MOGRT executor and worker')
          PY
          for f in editorial interpreter panel updater; do node --check "/tmp/aive0511/extension/lib/$f.js"; done
          node - <<'JS'
          const a=require('/tmp/aive0511/extension/lib/updater.js');
          const feed={schema:1,channel:'stable-pilot',version:'0.5.11',minVersion:'0.5.9',asset:{url:'https://github.com/Sankio9/ai-video-editor-updates/releases/download/aive-stable-pilot-v0.5.11/AIVE_STABLE_PILOT_0.5.11_UPDATE.zip',sha256:'366ecee1cc177b6c5c34a95dded70be846b9135db7c049faf0f314570d1b1616',size:113797}};
          const q=a.verifyFeed(feed,'0.5.9');
          if(!q.available||q.version!=='0.5.11')throw Error('0.5.9 refuses OTA');
          console.log('PASS: AIVE updater accepts 0.5.9 -> 0.5.11 channel');
          JS
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell 5.1 installer and updater worker
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:GITHUB_WORKSPACE 'release/stable-pilot/assets/AIVE_STABLE_PILOT_0.5.11_UPDATE.zip'
          $folder=Join-Path $env:RUNNER_TEMP 'AIVE_0511'
          Expand-Archive -LiteralPath $zip -DestinationPath $folder -Force
          $winPS=Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $script=Join-Path $env:RUNNER_TEMP 'parse_AIVE.ps1'
          @'
          param([string]$FilePath)
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($FilePath,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){$errors | ForEach-Object {Write-Error $_.Message};exit 1}
          Write-Host "PASS Windows PowerShell 5.1: $FilePath"
          '@ | Set-Content -LiteralPath $script -Encoding ASCII
          foreach($relative in @('INSTALL_PERSONAL.ps1','extension/update/worker.ps1')){
            & $winPS -NoProfile -NonInteractive -File $script -FilePath (Join-Path $folder $relative)
            if($LASTEXITCODE -ne 0){throw "Windows PS syntax fail: $relative"}
          }
          foreach($name in @('editorial','interpreter','panel','updater')){
            & node --check (Join-Path $folder ('extension/lib/'+$name+'.js'))
            if($LASTEXITCODE -ne 0){throw "JS syntax fail: $name"}
          }
          # Windows 5.1 exact installer sign-only QA: Adobe official signer, DPAPI, full ZXP.
          $signing=Join-Path $env:LOCALAPPDATA 'AIVE-Stable-Pilot\signing'
          $tools=Join-Path $env:LOCALAPPDATA 'AIVE-Stable-Pilot\tools'
          New-Item -ItemType Directory -Path $signing -Force | Out-Null
          if(Test-Path -LiteralPath (Join-Path $tools 'ZXPSignCmd.exe')){Remove-Item -LiteralPath (Join-Path $tools 'ZXPSignCmd.exe') -Force}
          $source='https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/ab5e4e3e53a42fad08e1225a22a991bb1ffe73f6/ZXPSignCMD/4.1.3/x64/ZXPSignCmd.exe'
          $exe=Join-Path $env:RUNNER_TEMP 'AIVE_ADOBE_SIGNER_CERT_TEST.exe'
          Invoke-WebRequest -UseBasicParsing -Uri $source -OutFile $exe
          if((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ffc2223167225ce61d024eb463fc5ad1a1be16133f99ef334a646f7311916c98'){throw 'Adobe signer SHA mismatch'}
          $pw='CI_EPHEMERAL_PASSWORD_ONLY'
          $cert=Join-Path $signing 'aive-stable-pilot.p12'
          & $exe -selfSignedCert US CA AIVE AIVE_0511_QA $pw $cert
          if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $cert)){throw 'Self-signed QA certificate unavailable'}
          # DPAPI must be produced by Windows PowerShell 5.1, same as the real installer.
          $dpapiScript=Join-Path $env:RUNNER_TEMP 'make-aive-dpapi.ps1'
          @'
          param([string]$Password, [string]$Destination)
          (ConvertTo-SecureString -String $Password -AsPlainText -Force | ConvertFrom-SecureString) | Set-Content -LiteralPath $Destination -Encoding UTF8
          '@ | Set-Content -LiteralPath $dpapiScript -Encoding ASCII
          & $winPS -NoProfile -NonInteractive -File $dpapiScript -Password $pw -Destination (Join-Path $signing 'password.dpapi')
          if($LASTEXITCODE -ne 0){throw 'Windows PowerShell DPAPI fixture creation failed'}
          & $winPS -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File (Join-Path $folder 'INSTALL_PERSONAL.ps1') -SignOnly
          if($LASTEXITCODE -ne 0){throw 'Exact Windows 0.5.11 installer failed to sign'}
          $zxp=Join-Path $folder 'AIVE_STABLE_PILOT_0.5.11_SIGNED.zxp'
          if(!(Test-Path -LiteralPath $zxp) -or (Get-Item -LiteralPath $zxp).Length -lt 10000){throw 'Signed ZXP missing/too small'}
          Write-Host 'PASS: exact installer completed official SHA-pinned sign, DPAPI and ZXP generation'
          Write-Host 'PASS AIVE 0.5.11 Windows release static gate'
  publish-stable-pilot:
    needs: [verify-linux, verify-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish prerelease, verify exact release bytes, then advance ONLY pilot channel
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = 'v1.9.13'
          TAG='aive-stable-pilot-v0.5.11'
          ASSET='AIVE_STABLE_PILOT_0.5.11_UPDATE.zip'
          FILE='release/stable-pilot/assets/AIVE_STABLE_PILOT_0.5.11_UPDATE.zip'
          SHA='366ecee1cc177b6c5c34a95dded70be846b9135db7c049faf0f314570d1b1616'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" \
              --title 'AIVE STABLE PILOT 0.5.11 — Adobe signer repair (personal Windows pilot)' \
              --notes 'Pilot 0.5.9 to 0.5.11: official Adobe SHA-pinned signer auto-bootstrap during user-triggered OTA, 0.5.10 DOCX changes preserved. Exact installer ZXP signing tested on Windows PowerShell 5.1; UPIA LIVE validation pending. Intended for personal Windows pilot only; workplace IT policy applies. BETA untouched.' \
              --prerelease --latest=false
          fi
          mkdir -p /tmp/aive0511_release_verify
          gh release download "$TAG" --pattern "$ASSET" --dir /tmp/aive0511_release_verify
          echo "$SHA  /tmp/aive0511_release_verify/$ASSET" | sha256sum -c -
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('release/stable-pilot/channel.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema']==1 and d['channel']=='stable-pilot'
          assert d['version'] in ('0.5.7','0.5.11'),'Unexpected live channel'
          if d['version']=='0.5.11':
            assert d['asset']['sha256']=='366ecee1cc177b6c5c34a95dded70be846b9135db7c049faf0f314570d1b1616'
          d.update({
            'version':'0.5.11',
            'minVersion':'0.5.9',
            'asset':{
              'url':'https://github.com/Sankio9/ai-video-editor-updates/releases/download/aive-stable-pilot-v0.5.11/AIVE_STABLE_PILOT_0.5.11_UPDATE.zip',
              'sha256':'366ecee1cc177b6c5c34a95dded70be846b9135db7c049faf0f314570d1b1616',
              'size':113797},
            'notes':'AIVE STABLE PILOT 0.5.11 — Adobe ZXPSignCmd 4.1.3 official SHA-pinned on-demand bootstrap. UPIA Premiere LIVE verification pending.',
            'release_status':'0.5.11-ota-live-validation-pending'})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          if ! git diff --quiet -- release/stable-pilot/channel.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add release/stable-pilot/channel.json
            git commit -m 'release(stable-pilot): enable pinned 0.5.11 OTA after Windows QA'
            git push origin HEAD:main
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = 'v1.9.13'
          echo 'PASS: verified prerelease live, stable-pilot channel pinned to 0.5.11; BETA untouched.'
