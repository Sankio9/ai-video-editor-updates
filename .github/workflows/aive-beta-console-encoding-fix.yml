name: Repair Beta updater console encoding via public release metadata
on:
  push:
    branches: [main]
    paths: ['release/beta-console-encoding-request.json']
permissions:
  contents: write
concurrency:
  group: aive-beta-encoding-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify intended server-side repair; freeze executable assets and Stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          expected={"operation":"ascii_safe_beta_release_metadata",
            "latest_beta":"v2.2.0",
            "asset_digest":"sha256:2dec078fa67cd75de67a24090d20258720cd8b88a48672d4eebbfae64002b00c",
            "reason":"Windows cp1252 UnicodeEncodeError in Beta updater check"}
          assert json.load(open('release/beta-console-encoding-request.json'))==expected
          PY
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = "v1.9.13"
          test "$(gh release view v2.2.0 --json isPrerelease --jq .isPrerelease)" = "true"
          test "$(gh api repos/$GH_REPO/releases/tags/v2.2.0 --jq '.assets[0].digest')" = 'sha256:2dec078fa67cd75de67a24090d20258720cd8b88a48672d4eebbfae64002b00c'
      - name: Normalize prerelease titles and notes to Windows-safe ASCII
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api 'repos/'"$GH_REPO"'/releases?per_page=100' > /tmp/aive-releases.json
          python - <<'PY'
          import json,subprocess,pathlib,unicodedata
          rows=json.load(open('/tmp/aive-releases.json'))
          repl=str.maketrans({"ă":"a","Ă":"A","â":"a","Â":"A","î":"i","Î":"I","ș":"s","Ș":"S","ş":"s","Ş":"S","ț":"t","Ț":"T","ţ":"t","Ţ":"T","—":"-","–":"-","„":'"',"”":'"',"“":'"',"’":"'","…":"...","≤":"<=","≥":">=","→":"->","•":"-"})
          def safe(s):
              s=(s or "").translate(repl)
              s=unicodedata.normalize('NFKD',s)
              return s.encode('ascii','ignore').decode('ascii')
          count=0
          for r in rows:
              if not r.get("prerelease"): continue
              tag=r['tag_name']
              name=r.get('name') or tag
              body=r.get('body') or ''
              fixed_title,fixed_body=safe(name),safe(body)
              if name==fixed_title and body==fixed_body: continue
              assert fixed_title and tag.startswith('v')
              if tag=='v1.9.13':raise RuntimeError('Do not touch Stable release')
              file=pathlib.Path('/tmp')/('aive-release-'+tag+'.md')
              file.write_text(fixed_body,encoding='utf8')
              subprocess.run(['gh','release','edit',tag,'--title',fixed_title,'--notes-file',str(file)],check=True)
              print('ASCII_METADATA_FIXED',tag,'old_non_ascii',sum(ord(c)>127 for c in name+body),
                    'new_name',fixed_title)
              count+=1
          assert count>0,'No release metadata required normalization'
          PY
      - name: Revalidate all Beta metadata on cp1252 and executable ZIP unchanged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api 'repos/'"$GH_REPO"'/releases?per_page=100' > /tmp/aive-after.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/aive-after.json'))
          latest=next(x for x in rows if x['tag_name']=='v2.2.0')
          assert latest['prerelease']
          assert latest['assets'][0]['digest']=='sha256:2dec078fa67cd75de67a24090d20258720cd8b88a48672d4eebbfae64002b00c'
          for r in rows:
              if not r['prerelease']:continue
              (r.get('name') or '').encode('cp1252')
              (r.get('body') or '').encode('cp1252')
          print('PASS: All Beta metadata encodes with Windows cp1252; v2.2.0 ZIP byte-for-byte unchanged')
          PY
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = 'v1.9.13'
          echo 'PASS: Stable v1.9.13 remains unchanged'
