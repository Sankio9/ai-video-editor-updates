name: R2.1.1 subtitle one-click & readable wrap (experimental)
on:
  push:
    branches: [feature/r20-independent-graphics-gate]
    paths:
      - 'experimental/r20/r211/**'
      - '.github/workflows/r211-subtitle-oneclick.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Word parser dependency
        run: python -m pip install 'python-docx==1.2.0'
      - name: Python 74-char captions and DOCX strike unchanged
        run: |
          set -eu
          python -m py_compile experimental/r20/r211/candidate/tools/r20_graphics_plans.py
          python -m unittest discover -s experimental/r20/r211/tests -p 'test_r211_planner.py' -v
          python -m unittest discover -s experimental/r20/r209/tests -p 'test_r209_strike_ooxml.py' -v
      - name: JS single-click CEP UI and asynchronous preflight
        run: |
          set -eu
          node --check experimental/r20/r211/candidate/cep/r20_panel.js
          node experimental/r20/r211/tests/test_r211_ui.js
          node experimental/r20/r211/tests/test_r211_full_flow.js
          node experimental/r20/candidate/tests_r20/test_r20_jsx_mock.js
          node experimental/r20/tests/guard.test.js
      - name: NameTag identity gates unchanged
        run: |
          cd experimental/r20/candidate
          python -m unittest discover -s tests_r20 -p 'test_r201_nametag.py' -v
          python -m unittest discover -s tests_r20 -p 'test_r203_review.py' -v
      - name: Guard stable and preserve track semantics
        run: |
          python - <<'PY'
          import json,pathlib
          assert json.loads(pathlib.Path('release/next.json').read_text('utf8'))['version']=='1.9.13'
          js=pathlib.Path('experimental/r20/r211/candidate/cep/r20_panel.js').read_text('utf8')
          py=pathlib.Path('experimental/r20/r211/candidate/tools/r20_graphics_plans.py').read_text('utf8')
          assert js.count("Inserează subtitrările")>=1
          assert "r210AnalyzeSubs" not in js and "r210SubtitlePreview" not in js
          assert "runSubtitlesOneClick" in js
          assert "STRIKETHROUGH_NOT_DETECTED" in js and "planSha" in js
          assert "split_subtitles_readable(original,74)" in py
          print('PASS: two-stage internal analysis, single UI button, 74-char wrap')
          PY
