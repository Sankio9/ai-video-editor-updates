name: Publish R2.1.3 Montage 01 safe ASR second-pass (BETA)
on:
  push:
    branches: [main]
    paths: ['release/r213-montage-request.json']
permissions:
  contents: write
concurrency:
  group: aive-r213-montage
  cancel-in-progress: false
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Require pinned source and frozen Stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          python - <<'PY'
          import json
          expected={'version':'2.1.3','source_sha':'35daf5d4af0e856e4a16abaadf2b71923792a189',
                    'requires_installed':'2.1.2',
                    'purpose':'Montage 01 conservative second phrase search on ASR; no timecode fallback or lower confidence thresholds'}
          assert json.load(open('release/r213-montage-request.json'))==expected
          PY
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = 'v1.9.13'
          test "$(gh release view v2.1.2 --json isPrerelease --jq .isPrerelease)" = 'true'
          ! gh release view v2.1.3 >/dev/null 2>&1
      - uses: actions/checkout@v4
        with:
          ref: 35daf5d4af0e856e4a16abaadf2b71923792a189
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Montage 01 matcher and fail-closed 8/17 selection
        run: |
          set -eu
          python -m py_compile experimental/r20/r213/candidate/tools/r213_second_pass.py
          python -m unittest discover -s experimental/r20/r213/tests -p test_r213_second_pass.py -v
          python -m unittest discover -s experimental/r20/r208/tests -p test_r208_montage_8_of_17.py -v
      - name: Retrieve only hash-pinned published baseline assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p dist/stable dist/prior
          gh release download v1.9.13 -p AIVE_UPDATE.zip --dir dist/stable
          gh release download v2.1.2 -p AIVE_UPDATE.zip --dir dist/prior
      - name: Build candidate montage pipeline from proven R1.9.13 release
        run: |
          python experimental/r20/r213/build_r213.py --stable dist/stable/AIVE_UPDATE.zip --prior dist/prior/AIVE_UPDATE.zip --output dist/AIVE_UPDATE.zip
          python - <<'PY'
          import json,zipfile,hashlib
          with zipfile.ZipFile('dist/AIVE_UPDATE.zip') as z:
              m=json.loads(z.read('manifest.json'))
              assert m['version']=='2.1.3' and m['format']==1 and len(m['files'])==2
              rows={x['path']:x for x in m['files']}
              assert set(rows)=={'tools/r193_pipeline.py','tools/r213_second_pass.py'}
              assert rows['tools/r193_pipeline.py']['before_sha256']=='8b49231f2c534f87ac2486f407fbc4466b1a2c77ee99961d0ed17d500959080e'
              assert rows['tools/r213_second_pass.py']['before_sha256'] is None
              for k,row in rows.items():
                  assert hashlib.sha256(z.read('payload/'+k)).hexdigest()==row['sha256']
              pipeline=z.read('payload/tools/r193_pipeline.py').decode('utf8')
              assert '_r213_recover(ev,words,result,max_search_s=90.)' in pipeline
              assert 'validate_speech_only(plan)' in pipeline
              assert 'r143_build.is_safe=guarded_safe' in pipeline
          print('PASS: original safety gates preserved, exactly two hash-verified files')
          PY
      - name: Publish experimental Beta only (no Stable promotion)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = 'v1.9.13'
          gh release create v2.1.3 dist/AIVE_UPDATE.zip \
            --target 35daf5d4af0e856e4a16abaadf2b71923792a189 \
            --title 'AI Video Editor R2.1.3 — Montaj 01 ASR Recovery (BETA)' \
            --notes 'BETA incremental from installed v2.1.2 via in-panel updater. Montage 01 adds a conservative second search using already transcribed REAL audio for unique full spoken passages. Requires exact beginning/end anchors, full transcript similarity >=0.88, avoids repeated utterances, no lowering of R1.9.13 safety thresholds and NEVER uses reporter timecodes as cut boundaries. No automatic cuts when audio evidence is insufficient: stays REVIEW and timeline unmodified. No changes to graphics modules 02/03/04 or VO 05 HOLD. Synthetic CI PASS; not tested on Bubuieci audio in Premiere. If 8/17 persists, send the newly generated local diagnostic JSON; further selective ASR recovery is needed. Stable v1.9.13 unchanged.' \
            --prerelease --latest=false
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = 'v1.9.13'
