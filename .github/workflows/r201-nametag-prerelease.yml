name: Publish isolated R2.0.1 NameTag test hotfix
on:
  push:
    branches: [main]
    paths:
      - 'release/r201-test-request.json'
permissions:
  contents: write
concurrency:
  group: aive-r201-prerelease
  cancel-in-progress: false
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen request and stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open('release/r201-test-request.json'))
          assert data == {
            "version":"2.0.1",
            "head_sha":"7a907fdccc61381cd332db732e2c58b5c43fdeef",
            "base":"2.0.0",
            "purpose":"NameTag parser hotfix only; prerelease test"
          }
          PY
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = "v1.9.13"
          ! gh release view v2.0.1 >/dev/null 2>&1
      - uses: actions/checkout@v4
        with:
          ref: 7a907fdccc61381cd332db732e2c58b5c43fdeef
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent test dependency
        run: python -m pip install "python-docx==1.2.0"
      - name: Regression tests before release
        run: |
          cd experimental/r20/candidate
          python -m unittest discover -s tests_r20 -p 'test_r201_nametag.py' -v
          node tests_r20/test_r20_jsx_mock.js
      - name: Build exact one-file update with baseline hash
        run: |
          python experimental/r20/hotfix/build_r201.py --output dist/AIVE_UPDATE.zip
          python - <<'PY'
          import hashlib,json,zipfile
          with zipfile.ZipFile('dist/AIVE_UPDATE.zip') as z:
              manifest=json.loads(z.read('manifest.json'))
              assert manifest['version']=='2.0.1'
              assert manifest['files']==[{
                'path':'tools/r20_graphics_plans.py',
                'before_sha256':'37ec5e19ae2223d079263cbac9763fe2cb915593f9d4e37151cff7d522fa562f',
                'sha256':'df0b5f4ab1aa87274305222e51ea02b5adc44b26b72d72155ce38e4a2d52c9af'}]
              assert hashlib.sha256(z.read('payload/tools/r20_graphics_plans.py')).hexdigest()==manifest['files'][0]['sha256']
          PY
      - name: Release R2.0.1 experimental only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v2.0.1 dist/AIVE_UPDATE.zip \
            --target 7a907fdccc61381cd332db732e2c58b5c43fdeef \
            --title "AI Video Editor R2.0.1 — NameTag parser HOTFIX (test)" \
            --notes "Experimental prerelease ONLY over local v2.0.0. One-file SHA-gated NameTag planner hotfix for same-paragraph SINCRON/AMB and missing separate source headers. V1/V3/V5 and other modules unchanged. Live Premiere validation required." \
            --prerelease --latest=false
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = "v1.9.13"
