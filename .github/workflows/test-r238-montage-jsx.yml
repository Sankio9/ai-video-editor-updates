name: R238 montage 01 file bridge and JSX preflight regression (NO RELEASE)
on:
  push:
    branches: [feature/r20-independent-graphics-gate]
    paths: [.github/workflows/test-r238-montage-jsx.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test 13 Premiere API mocks and file-based commit failure isolation
        run: |
          set -eu
          node experimental/r20/r238/tests/test_r238_writer.js
      - name: Check syntax and exact source-panel identity
        run: |
          set -eu
          node --check < experimental/r20/r238/cep/jsx/r220_montage_writer.jsx
          node --check experimental/r20/r238/cep/r220_montage_panel.js
          python - <<'PY'
          from pathlib import Path
          origin=Path('experimental/r20/r220/cep/jsx/r220_montage_writer.jsx').read_text()
          revised=Path('experimental/r20/r238/cep/jsx/r220_montage_writer.jsx').read_text()
          panel=Path('experimental/r20/r238/cep/r220_montage_panel.js').read_text()
          assert 'AIVE_R220.commitFromFile' in panel
          assert 'function commitFromFile' in revised
          assert 's.overwriteClip(item,String(c.timelineStart),0,0)' in revised
          assert 'rollback(s,added,markers)' in revised
          assert origin.count('function commit(planJson')==revised.count('function commit(planJson')==1
          assert 'AIVE_R220.commit('+chr(43)+'params' not in panel
          print('PASS original preflight/readback/rollback intact and no large plan literal across CEP bridge')
          PY
