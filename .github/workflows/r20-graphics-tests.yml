name: R2.0 independent graphics mock gate
on:
  pull_request:
    paths:
      - 'experimental/r20/**'
      - '.github/workflows/r20-graphics-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard safety tests
        run: |
          node experimental/r20/tests/guard.test.js
          node experimental/r20/candidate/tests_r20/test_r20_jsx_mock.js
