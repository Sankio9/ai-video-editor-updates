name: R2.0 graphics regression candidate gate
on:
  pull_request:
    paths:
      - 'experimental/r20/**'
      - '.github/workflows/r20-graphics-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard and Premiere mocked MOGRT tests
        run: |
          node experimental/r20/tests/guard.test.js
          node experimental/r20/candidate/tests_r20/test_r20_jsx_mock.js
          node --check experimental/r20/candidate/cep/r20_panel.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser-test dependency
        run: python -m pip install 'python-docx==1.2.0'
      - name: NameTag header, review and skip approval regressions
        run: |
          cd experimental/r20/candidate
          python -m unittest discover -s tests_r20 -p 'test_r201_nametag.py' -v
          python -m unittest discover -s tests_r20 -p 'test_r203_review.py' -v
      - name: Build and verify pinned R2.0.3 two-file Beta update
        run: python experimental/r20/hotfix/build_r203.py --output dist/R203_CANDIDATE_UPDATE.zip
      - name: Archive candidate for code review (do not install manually)
        uses: actions/upload-artifact@v4
        with:
          name: r203-review-only
          path: dist/R203_CANDIDATE_UPDATE.zip
