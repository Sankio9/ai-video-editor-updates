name: R2.2 Workflow Compatibility
on:
  push:
    branches: ['feature/r20-independent-graphics-gate']
    paths: ['.github/workflows/r222-workflow-compat.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare known released workflow hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p /tmp/compat
          for tag in v1.9.10 v1.9.13 v2.0.2 v2.1.3 v2.2.0; do
            mkdir -p "/tmp/compat/$tag"
            gh release download "$tag" -p AIVE_UPDATE.zip --dir "/tmp/compat/$tag" || true
          done
          python - <<'PY'
          import zipfile,json,pathlib
          for archive in sorted(pathlib.Path('/tmp/compat').glob('*/AIVE_UPDATE.zip')):
             with zipfile.ZipFile(archive) as z:
                m=json.loads(z.read('manifest.json'))
                for x in m['files']:
                  if x['path']=='cep/r193_workflow.js':
                    print('WORKFLOW_HASH',archive.parent.name,x['sha256'],x.get('before_sha256'))
          PY
